# Content Lab — uses supabase start for DB (port 54322)
services:
  backend:
    image: content-lab-app
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://backend:8000
      SUPABASE_ANON_KEY: local-anon-key
      ENVIRONMENT: development
      TIKTOK_METRICS_PROVIDER: fake
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    image: content-lab-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://backend:8000
      SUPABASE_ANON_KEY: local-anon-key
      ENVIRONMENT: development
      TIKTOK_METRICS_PROVIDER: fake
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL: "5"
      WORKER_HEARTBEAT_INTERVAL: "30"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m app.workers
